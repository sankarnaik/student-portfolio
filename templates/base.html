<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Personal portfolio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="{{ theme }}-theme">
<header>
  <a class="brand" href="#about" aria-label="Aditya, home">Aditya<span>.</span></a>
  <nav aria-label="Portfolio sections">
    <a href="#about">About</a> <a href="#skills">Skills</a>
    <a href="#projects">Projects</a> <a href="#contact">Contact</a>
  </nav>
  <form method="post" action="{{ url_for('set_theme') }}">
    <button>{{ 'Dark' if theme == 'light' else 'Light' }} mode</button>
  </form>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>© {{ year }} Aditya Rao</footer>
</body>
</html>
